<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Чаты смены — Школково</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="shift.css">
  <script src="shift.js" defer></script>
</head>
<body>
  <header class="brand"><div class="wrap"><img src="icon.png" width="24" height="24" alt="">Школково <span>Вкладка старшего</span></div></header>
  <main class="wrap">
    <div class="heading"><h1>Занятые чаты</h1><span id="monitor-state" class="monitor-state" role="status">Загрузка…</span></div>
    <div class="meta"><span id="activity-hour"></span><span id="occupied-count"></span><span id="period"></span></div>
    <p id="schedule-status" role="status" hidden></p>
    <p id="feedback" role="status" hidden></p>
    <div id="groups"></div>
    <p id="empty" hidden></p>
  </main>
</body>
</html>
